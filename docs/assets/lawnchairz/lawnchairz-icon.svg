<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <!-- Copyright 2026 Corey Flynn and LawnchairZ contributors. SPDX-License-Identifier: Apache-2.0 -->
  <!-- LawnchairZ adaptive icon: a striped folding lawn chair on the inner screen of an
       open foldable. 108x108 canvas = adaptive icon; content stays inside the 66-unit safe zone. -->
  <defs>
    <clipPath id="screens">
      <path d="M32.5 35 L52.8 38 L52.8 70 L32.5 73 Z M75.5 35 L55.2 38 L55.2 70 L75.5 73 Z"/>
    </clipPath>
  </defs>

  <!-- background layer -->
  <rect id="background" width="108" height="108" fill="#E4F3E7"/>

  <g id="foreground">
    <!-- open foldable: two halves angled toward the viewer, meeting at the hinge -->
    <path d="M30 32 L54 35.5 L54 72.5 L30 76 Z M78 32 L54 35.5 L54 72.5 L78 76 Z"
          fill="#22303A" stroke="#22303A" stroke-width="4" stroke-linejoin="round"/>
    <g clip-path="url(#screens)">
      <rect x="30" y="30" width="48" height="48" fill="#A8DDF7"/>
      <rect x="30" y="64" width="48" height="14" fill="#8FD18F"/>
      <circle cx="69" cy="43.5" r="3.6" fill="#FFD25A"/>
    </g>

    <!-- chair back webbing (stripes) -->
    <path d="M38 38 L43 37 L44.4 41.6 L39.4 42.6 Z" fill="#FF7A59"/>
    <path d="M39.4 42.6 L44.4 41.6 L45.8 46.2 L40.8 47.2 Z" fill="#FFFFFF"/>
    <path d="M40.8 47.2 L45.8 46.2 L47.2 50.8 L42.2 51.8 Z" fill="#FF7A59"/>
    <path d="M42.2 51.8 L47.2 50.8 L48.6 55.4 L43.6 56.4 Z" fill="#FFFFFF"/>
    <path d="M43.6 56.4 L48.6 55.4 L50 60 L45 61 Z" fill="#FF7A59"/>
    <!-- chair seat webbing (stripes) -->
    <path d="M45 61 L50.25 60.13 L52.13 56.98 L47.5 57.8 Z" fill="#FFFFFF"/>
    <path d="M50.25 60.13 L55.5 59.25 L56.75 56.15 L52.13 56.98 Z" fill="#FF7A59"/>
    <path d="M55.5 59.25 L60.75 58.38 L61.38 55.33 L56.75 56.15 Z" fill="#FFFFFF"/>
    <path d="M60.75 58.38 L66 57.5 L66 54.5 L61.38 55.33 Z" fill="#FF7A59"/>
    <!-- chair frame -->
    <g fill="none" stroke="#1F4A2C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M38 38 L45 61 L66 57.5"/>
      <path d="M42 50 L62 47 L65.5 57.5"/>
      <path d="M46.5 61 L63.5 70.5"/>
      <path d="M64.5 58 L47.5 70.5"/>
    </g>
  </g>
</svg>
